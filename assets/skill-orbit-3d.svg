<svg viewBox="0 0 800 420" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f2027"/>
      <stop offset="60%" stop-color="#16324a"/>
      <stop offset="100%" stop-color="#0f2027"/>
    </linearGradient>
    <radialGradient id="core" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#bdf3ff"/>
      <stop offset="55%" stop-color="#00c6ff"/>
      <stop offset="100%" stop-color="#0b5a78"/>
    </radialGradient>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00c6ff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#00c6ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="dotWeb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7fe8ff"/><stop offset="100%" stop-color="#00c6ff"/>
    </linearGradient>
    <linearGradient id="dotEmb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffd27f"/><stop offset="100%" stop-color="#ff9d00"/>
    </linearGradient>
    <linearGradient id="dotAi" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c9a3ff"/><stop offset="100%" stop-color="#7b3fe4"/>
    </linearGradient>
  </defs>

  <rect width="800" height="420" fill="url(#bg2)"/>

  <text x="400" y="42" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="24" font-weight="800" fill="#e6f7ff" letter-spacing="2">SKILLS IN ORBIT</text>

  <!-- orbit paths (tilted ellipses for perspective) -->
  <g transform="translate(400,235)">
    <path id="orbitA" d="M -300,0 A 300,70 0 1,0 300,0 A 300,70 0 1,0 -300,0" fill="none" stroke="#2c5364" stroke-width="1.5" stroke-dasharray="4 5" opacity="0.7"/>
    <path id="orbitB" d="M -220,0 A 220,95 0 1,0 220,0 A 220,95 0 1,0 -220,0" fill="none" stroke="#2c5364" stroke-width="1.5" stroke-dasharray="4 5" opacity="0.7" transform="rotate(18)"/>
    <path id="orbitC" d="M -150,0 A 150,55 0 1,0 150,0 A 150,55 0 1,0 -150,0" fill="none" stroke="#2c5364" stroke-width="1.5" stroke-dasharray="4 5" opacity="0.7" transform="rotate(-14)"/>

    <!-- core sphere -->
    <circle r="50" fill="url(#coreGlow)">
      <animate attributeName="r" values="46;56;46" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle r="30" fill="url(#core)"/>
    <text y="6" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#08202b">ME</text>

    <!-- orbiting nodes -->
    <circle r="10" fill="url(#dotWeb)">
      <animateMotion dur="7s" repeatCount="indefinite"><mpath href="#orbitA"/></animateMotion>
    </circle>
    <circle r="9" fill="url(#dotEmb)">
      <animateMotion dur="9s" repeatCount="indefinite"><mpath href="#orbitB"/></animateMotion>
    </circle>
    <circle r="8" fill="url(#dotAi)">
      <animateMotion dur="5.5s" repeatCount="indefinite"><mpath href="#orbitC"/></animateMotion>
    </circle>
  </g>

  <!-- legend -->
  <g font-family="Segoe UI, sans-serif" font-size="14" font-weight="600">
    <circle cx="260" cy="380" r="7" fill="url(#dotWeb)"/>
    <text x="278" y="385" fill="#cfeefc">Full Stack</text>

    <circle cx="400" cy="380" r="7" fill="url(#dotEmb)"/>
    <text x="418" y="385" fill="#cfeefc">Embedded</text>

    <circle cx="545" cy="380" r="7" fill="url(#dotAi)"/>
    <text x="563" y="385" fill="#cfeefc">AI / ML</text>
  </g>
</svg>
